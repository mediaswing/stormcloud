# Builds the release downloads when a version tag (for example v1.0.0)
# is pushed, and publishes them on a GitHub release whose text comes from the
# matching section of CHANGELOG.md. Each download is first submitted to
# VirusTotal, and a table of scan links is added to the release notes.
#
# Requires the repository secret VT_API_KEY (a VirusTotal API key).
#
# Packaging:
#   * macOS: `stormcloud --package-macos dist` (src/platform/macos.rs) builds the
#     .app bundle, signs it ad hoc and wraps it in an installer package (.pkg)
#     that puts it in /Applications. The macos job tests installing it.
#   * Linux: `stormcloud --package-deb dist` (src/platform/linux.rs) writes the .deb,
#     which the linux job renames to use hyphens instead of underscores and
#     tests installing.
#   * Windows: a PowerShell step in the windows job stages the exe with the
#     GPL, the font licence, the icon credit and the Visual C++ runtime DLLs it imports. WiX Toolset then
#     builds an MSI installer from those files, described by
#     src/installer/stormcloud.wxs, and the job tests installing, upgrading and
#     uninstalling it.
#
# The tag must match the version in Cargo.toml, which names the .deb and .pkg,
# and must be three numbers such as v1.0.0, because the MSI's version comes
# from it.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Windows Installer versions are three numbers, the first two at most
      # 255 and the third at most 65535, with nothing after them, so check the
      # tag before the long build.
      - name: Check the tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($version -notmatch '^(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,4})$' -or
              [int]$Matches[1] -gt 255 -or [int]$Matches[2] -gt 255 -or [int]$Matches[3] -gt 65535) {
            Write-Host "::error::The tag $env:GITHUB_REF_NAME can't be used as a Windows Installer version. Use a tag such as v1.0.0: three numbers, the first two at most 255 and the third at most 65535, with no suffix such as -beta."
            exit 1
          }
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($cargo -ne $version) {
            Write-Host "::error::The tag $env:GITHUB_REF_NAME doesn't match the version $cargo in Cargo.toml."
            exit 1
          }
          Write-Host "Version: $version"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo test --locked
      - run: cargo build --release --locked
      # Stage the exe with the GPL, the font licence, the icon credit and the Visual C++
      # runtime DLLs it uses, so it runs on PCs without the Visual C++ Redistributable. The
      # runtime list comes from the exe's own imports; DLLs that are part of
      # Windows are not copied.
      - name: Stage the exe with its DLLs
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory | Select-Object -Last 1
          if (-not $dumpbin -or -not $crt) { throw "Visual C++ tools or runtime not found under $vs" }
          $imports = & $dumpbin.FullName /nologo /dependents target\release\stormcloud.exe |
            ForEach-Object { $_.Trim() } | Where-Object { $_ -like '*.dll' }
          $dlls = $imports | ForEach-Object { Join-Path $crt.FullName $_ } | Where-Object { Test-Path $_ }
          if (-not $dlls) { throw "No Visual C++ runtime DLLs found in the exe's imports: $($imports -join ', ')" }
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $folder = "stormcloud-$version-windows-x86_64"
          New-Item -ItemType Directory -Force "stage\$folder", dist | Out-Null
          Copy-Item -Path (@('target\release\stormcloud.exe') + $dlls) -Destination "stage\$folder"
          Copy-Item LICENSE "stage\$folder\LICENSE.txt"
          Copy-Item assets\fonts\OFL.txt "stage\$folder\fonts-OFL.txt"
          Copy-Item assets\icon\CREDITS.txt "stage\$folder\icon-CREDITS.txt"
          Write-Host "Staged:" (Get-ChildItem "stage\$folder").Name
      # WiX Toolset builds the MSI. The version is pinned so that every
      # release is built the same way.
      - name: Install WiX Toolset
        shell: pwsh
        run: |
          $wix = "$env:RUNNER_TEMP\wix"
          dotnet tool install wix --version 6.0.2 --tool-path $wix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$wix\wix.exe" extension add -g WixToolset.UI.wixext/6.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wix >> $env:GITHUB_PATH
      # The MSI installs the files staged above.
      # src\installer\stormcloud.wxs describes it; the Visual C++ runtime DLLs
      # are whichever ones the step above copied. wix build also runs the
      # Windows Installer validation checks (ICEs).
      - name: Build the MSI
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $folder = "stormcloud-$version-windows-x86_64"
          $stage = (Resolve-Path "stage\$folder").Path
          $runtime = (Get-ChildItem $stage -Filter *.dll).Name
          wix build src\installer\stormcloud.wxs -arch x64 -culture en-US -ext WixToolset.UI.wixext -pdbtype none `
            -d "Version=$version" -d "StageDir=$stage" -d "RuntimeDlls=$($runtime -join ';')" `
            -o "dist\$folder.msi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Checks that the MSI holds exactly the staged files, has the right
      # version, name and upgrade code, and installs without administrator
      # rights.
      - name: Check the MSI
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $folder = "stormcloud-$version-windows-x86_64"
          $msi = (Resolve-Path "dist\$folder.msi").Path
          $upgradeCode = '{' + ([xml](Get-Content src\installer\stormcloud.wxs)).Wix.Package.UpgradeCode + '}'
          # The Windows Installer COM objects only work through late binding.
          function Msi($object, $name, $kind, [object[]]$arguments) {
            $object.GetType().InvokeMember($name, $kind, $null, $object, $arguments)
          }
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = Msi $installer OpenDatabase InvokeMethod @($msi, 0)
          function Query($sql) {
            $view = Msi $db OpenView InvokeMethod @($sql)
            Msi $view Execute InvokeMethod @() | Out-Null
            while ($record = Msi $view Fetch InvokeMethod @()) { Msi $record StringData GetProperty @(1) }
            Msi $view Close InvokeMethod @() | Out-Null
          }
          function Property($name) { Query "SELECT Value FROM Property WHERE Property = '$name'" }

          $problems = @()
          # File names are stored as "SHORT~1.DLL|long name.dll".
          $inMsi = Query 'SELECT FileName FROM File' | ForEach-Object { ($_ -split '\|')[-1] } | Sort-Object
          $staged = (Get-ChildItem "stage\$folder").Name | Sort-Object
          Write-Host "Files in the MSI:" ($inMsi -join ', ')
          if (Compare-Object @($inMsi) @($staged)) { $problems += "The MSI holds $($inMsi -join ', ') but the staged files are $($staged -join ', ')" }
          $expected = @{ ProductVersion = $version; UpgradeCode = $upgradeCode; ProductName = 'Graphical Cloud Management'; Manufacturer = 'The Graphical Cloud Management contributors' }
          foreach ($name in $expected.Keys) {
            $value = Property $name
            Write-Host "${name}: $value"
            if ($value -ne $expected[$name]) { $problems += "$name is '$value', not '$($expected[$name])'" }
          }
          if (Property ALLUSERS) { $problems += 'ALLUSERS is set, so the MSI would not install for the current user only' }
          # Bit 3 of the word count says that administrator rights aren't needed.
          $summary = Msi $installer SummaryInformation GetProperty @($msi, 0)
          if (-not ((Msi $summary Property GetProperty @(15)) -band 8)) { $problems += 'The MSI asks for administrator rights' }
          if ($problems) { $problems | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
      # Installs an older build of the same MSI, upgrades it to this one,
      # starts the installed app and uninstalls it, checking that the user's
      # settings are left alone throughout. The runner's account is an
      # administrator, so this can't show that ordinary accounts need no
      # administrator rights; the check above covers that.
      - name: Test installing, upgrading and uninstalling the MSI
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $folder = "stormcloud-$version-windows-x86_64"
          $msi = (Resolve-Path "dist\$folder.msi").Path
          $stage = (Resolve-Path "stage\$folder").Path
          $upgradeCode = '{' + ([xml](Get-Content src\installer\stormcloud.wxs)).Wix.Package.UpgradeCode + '}'
          $dir = "$env:LOCALAPPDATA\Programs\Graphical Cloud Management"
          $shortcut = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Graphical Cloud Management.lnk"
          function Msi($object, $name, $kind, [object[]]$arguments) {
            $object.GetType().InvokeMember($name, $kind, $null, $object, $arguments)
          }
          $installer = New-Object -ComObject WindowsInstaller.Installer
          # PowerShell unrolls the list of product codes into strings.
          function Installed {
            foreach ($code in @(Msi $installer RelatedProducts GetProperty @($upgradeCode))) {
              Msi $installer ProductInfo GetProperty @($code, 'VersionString')
            }
          }
          function Msiexec($arguments, $log) {
            $p = Start-Process msiexec.exe -ArgumentList ($arguments + '/qn', '/norestart', '/l*v', "`"$log`"") -Wait -PassThru
            if ($p.ExitCode -ne 0) {
              Get-Content $log -Tail 60
              throw "msiexec $arguments failed with exit code $($p.ExitCode)"
            }
          }
          function Check($ok, $message) { if (-not $ok) { throw $message } }

          # A stand-in for the settings, token and log the app keeps.
          $kept = "$env:APPDATA\StormCloud\msi-test.txt"
          New-Item -ItemType File -Force $kept | Out-Null
          function Check-Kept($when) { Check (Test-Path $kept) "$kept was removed $when" }

          $runtime = (Get-ChildItem $stage -Filter *.dll).Name
          $old = "$env:RUNNER_TEMP\stormcloud-old.msi"
          wix build src\installer\stormcloud.wxs -arch x64 -culture en-US -ext WixToolset.UI.wixext -pdbtype none `
            -d "Version=0.0.1" -d "StageDir=$stage" -d "RuntimeDlls=$($runtime -join ';')" -o $old
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Msiexec @('/i', "`"$old`"") "$env:RUNNER_TEMP\install-old.log"
          Check ((Installed) -eq '0.0.1') "The older MSI did not install: $(Installed)"
          Check-Kept 'by installing'
          # Make the older install look like one from before the rename, which used the
          # "Graphical Cloud Manager" folder; the upgrade must move to the new one.
          Set-ItemProperty HKCU:\Software\StormCloud\Installer InstallFolder "$env:LOCALAPPDATA\Programs\Graphical Cloud Manager\"

          Msiexec @('/i', "`"$msi`"") "$env:RUNNER_TEMP\upgrade.log"
          $versions = @(Installed)
          Check ($versions.Count -eq 1 -and $versions[0] -eq $version) "After upgrading, the installed versions are: $($versions -join ', ')"
          Check-Kept 'by upgrading'
          $files = (Get-ChildItem $dir).Name | Sort-Object
          Check (-not (Compare-Object @($files) @((Get-ChildItem $stage).Name | Sort-Object))) "$dir holds: $($files -join ', ')"
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut).TargetPath
          Check ($target -eq "$dir\stormcloud.exe") "The Start menu shortcut points at '$target'"
          # The app can't start if Windows can't find one of its DLLs.
          $out = "$env:RUNNER_TEMP\version.txt"
          $p = Start-Process $target -ArgumentList '--version' -RedirectStandardOutput $out -Wait -PassThru
          Check ($p.ExitCode -eq 0) "The installed app failed to start (exit code $($p.ExitCode))"
          $said = Get-Content $out
          Write-Host "Installed app says: $said"
          Check ($said -eq "stormcloud $version") "The installed app says '$said', not 'stormcloud $version'"

          Msiexec @('/x', "`"$msi`"") "$env:RUNNER_TEMP\uninstall.log"
          Check (-not (Installed)) "Still installed after uninstalling: $(Installed)"
          Check (-not (Test-Path $dir)) "$dir is still there after uninstalling"
          Check (-not (Test-Path $shortcut)) 'The Start menu shortcut is still there after uninstalling'
          Check (-not (Test-Path HKCU:\Software\StormCloud\Installer)) 'HKCU\Software\StormCloud\Installer is still there after uninstalling'
          Check-Kept 'by uninstalling'

          Remove-Item $kept
          Write-Host 'Installed, upgraded, started and uninstalled; settings were kept.'
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: windows
          path: dist/*.msi
          if-no-files-found: error
          retention-days: 21

  linux:
    name: Ubuntu .deb (amd64)
    # The oldest supported Ubuntu LTS, so the package installs on 22.04 and later.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: >-
            pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev
          version: 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: target/release/stormcloud --package-deb dist
      # Debian names the file stormcloud_<version>_<arch>.deb; use hyphens to
      # match the Windows and macOS downloads.
      - name: Rename the .deb with hyphens
        run: |
          for f in dist/*.deb; do
            mv "$f" "dist/$(basename "$f" | tr _ -)"
          done
          ls dist
      # apt resolves the Depends line, so this also checks every dependency
      # exists on the oldest supported Ubuntu.
      - name: Test installing the package
        run: |
          set -euo pipefail
          sudo apt-get install -y "./$(ls dist/*.deb)"
          echo "Installed app says: $(/usr/bin/stormcloud --version)"
          sudo apt-get remove -y stormcloud
          test ! -e /usr/bin/stormcloud
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: linux
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 21

  macos:
    name: macOS .pkg (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo test --locked
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: target/aarch64-apple-darwin/release/stormcloud --package-macos dist
      - name: Test installing the package
        run: |
          set -euo pipefail
          pkg=$(ls dist/*.pkg)
          # A stand-in for a version from before the rename, which the package must remove.
          old="/Applications/Graphical Cloud Manager.app"
          sudo mkdir -p "$old/Contents"
          sudo defaults write "$old/Contents/Info" CFBundleIdentifier io.github.mediaswing.stormcloud
          sudo installer -pkg "$pkg" -target /
          test ! -e "$old" || { echo "::error::$old was not removed"; exit 1; }
          app="/Applications/Graphical Cloud Management.app"
          codesign --verify --strict --verbose=2 "$app"
          echo "Installed app says: $("$app/Contents/MacOS/stormcloud" --version)"
          pkgutil --pkg-info io.github.mediaswing.stormcloud
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: macos
          path: dist/*.pkg
          if-no-files-found: error
          retention-days: 21

  release:
    name: Publish release
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read release notes from CHANGELOG.md
        uses: ffurrer2/extract-release-notes@v3.1.0
        with:
          release_notes_file: changelog-notes.md
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      # Scan before publishing so the results can go into the release notes.
      # A VirusTotal outage must not block a release, so failures are allowed
      # and the scan table is simply left out.
      - name: Scan downloads with VirusTotal
        id: virustotal
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@v5.0.0
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            artifacts/*.deb
            artifacts/*.msi
            artifacts/*.pkg
          # The free VirusTotal API allows 4 requests a minute.
          request_rate: 4
      - name: Write release notes
        uses: actions/github-script@v9.0.0
        env:
          SCAN_OUTCOME: ${{ steps.virustotal.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');

            // The changelog section may be empty (or absent).
            let notes = fs.existsSync('changelog-notes.md')
              ? fs.readFileSync('changelog-notes.md', 'utf8').trim()
              : '';

            if (process.env.SCAN_OUTCOME === 'success') {
              const platform = (name) =>
                name.endsWith('.msi') ? 'Windows installer' :
                name.endsWith('.deb') ? 'Ubuntu' :
                name.includes('-macos-') ? 'Apple Silicon' : '';
              const rows = fs.readdirSync('artifacts').sort().map((name) => {
                const sha = crypto.createHash('sha256')
                  .update(fs.readFileSync(path.join('artifacts', name)))
                  .digest('hex');
                // The permanent report for this exact file.
                const url = `https://www.virustotal.com/gui/file/${sha}`;
                return `| \`${name}\` (${platform(name)}) | \`${sha}\` | [View scan](${url}) |`;
              });
              const table = [
                '## VirusTotal scans',
                '',
                '| Download | SHA-256 | Report |',
                '| --- | --- | --- |',
                ...rows,
              ].join('\n');
              notes = notes ? `${notes}\n\n${table}` : table;
            } else {
              core.warning('VirusTotal scan failed; publishing without scan results.');
            }

            fs.writeFileSync('release-notes.md', notes + '\n');
      - uses: softprops/action-gh-release@v3.0.3
        with:
          body_path: release-notes.md
          files: |
            artifacts/*.deb
            artifacts/*.msi
            artifacts/*.pkg
          fail_on_unmatched_files: true
